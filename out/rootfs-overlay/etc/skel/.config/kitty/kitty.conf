# ==============================================================================
# Hyle OS 1.0 - Default Kitty Terminal Configuration
# ==============================================================================

# Font configuration
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & Padding
window_padding_width 10
background_opacity 0.88
hide_window_decorations yes
confirm_os_window_close 0

# Colors (Material You Dark Theme)
foreground            #e5e0f0
background            #0e0b16
selection_foreground  #0e0b16
selection_background  #a08cdc
url_color             #82c8f0

cursor                #a08cdc
cursor_text_color     #0e0b16

# 16 Terminal Colors
color0   #181424
color1   #f06e6e
color2   #78d28c
color3   #f0c86e
color4   #82c8f0
color5   #a08cdc
color6   #6ec8d2
color7   #e5e0f0

color8   #504868
color9   #f58c8c
color10  #96dc9e
color11  #f5d78c
color12  #9ed7f5
color13  #b4a3e6
color14  #8cd7dc
color15  #ffffff

# Enable Wayland features
linux_display_server wayland
